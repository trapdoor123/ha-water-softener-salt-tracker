[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # modern Python syntax
    "B",      # likely bugs
    "SIM",    # simplifications
    "ASYNC",  # blocking calls in async code
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
